<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" lang="ru">
  <head>
    <meta http-equiv="Content-Type" content="application/xhtml+xml; charset=utf-8" />
    <title>Студенты API</title>
    <style type="text/css">
      body { font-family: Arial, sans-serif; margin: 2rem; background-color: #f4f6f8; color: #1f2933; }
      h1, h2 { color: #0b3d91; }
      form { background: #ffffff; border: 1px solid #d0d7de; border-radius: 8px; padding: 1rem; margin-bottom: 1.5rem; }
      fieldset { border: none; margin: 0; padding: 0; }
      label { display: block; margin-bottom: 0.5rem; }
      input { width: 100%; padding: 0.5rem; margin-bottom: 1rem; border: 1px solid #cbd2d9; border-radius: 4px; }
      button { background: #0b3d91; color: #ffffff; border: none; border-radius: 4px; padding: 0.6rem 1rem; cursor: pointer; }
      button:hover { background: #0a357f; }
      table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
      th, td { border: 1px solid #d0d7de; padding: 0.5rem; text-align: left; }
      tbody tr:nth-child(odd) { background: #eef2f7; }
      .actions { display: flex; gap: 1rem; flex-wrap: wrap; }
      .status { margin-top: 1rem; min-height: 1.5rem; }
      code { background: #eef2f7; padding: 0.2rem 0.4rem; border-radius: 4px; }
    </style>
  </head>
  <body>
    <h1>REST API для студентов</h1>
    <p>Эта страница позволяет протестировать эндпоинты <code>/api/students</code> без использования Postman.</p>

    <form id="filter-form">
      <fieldset>
        <legend><strong>Фильтрация</strong></legend>
        <label for="filter-group">Группа</label>
        <input id="filter-group" name="group" type="text" />
        <label for="filter-gpa">Минимальный GPA</label>
        <input id="filter-gpa" name="minGpa" type="number" step="0.01" min="0" max="5" />
        <button type="submit">Загрузить список</button>
      </fieldset>
    </form>

    <table aria-label="Список студентов">
      <thead>
        <tr>
          <th>ID</th>
          <th>Имя</th>
          <th>Фамилия</th>
          <th>Группа</th>
          <th>GPA</th>
        </tr>
      </thead>
      <tbody id="students-body"></tbody>
    </table>

    <div class="actions">
      <form id="create-form">
        <fieldset>
          <legend><strong>Создать студента</strong></legend>
          <label for="create-first-name">Имя</label>
          <input id="create-first-name" name="firstName" type="text" required="required" />
          <label for="create-last-name">Фамилия</label>
          <input id="create-last-name" name="lastName" type="text" required="required" />
          <label for="create-group">Группа</label>
          <input id="create-group" name="group" type="text" required="required" />
          <label for="create-gpa">GPA</label>
          <input id="create-gpa" name="gpa" type="number" step="0.01" min="0" max="5" required="required" />
          <button type="submit">Создать</button>
        </fieldset>
      </form>

      <form id="update-form">
        <fieldset>
          <legend><strong>Обновить студента</strong></legend>
          <label for="update-id">ID</label>
          <input id="update-id" name="id" type="number" min="1" required="required" />
          <label for="update-first-name">Имя</label>
          <input id="update-first-name" name="firstName" type="text" required="required" />
          <label for="update-last-name">Фамилия</label>
          <input id="update-last-name" name="lastName" type="text" required="required" />
          <label for="update-group">Группа</label>
          <input id="update-group" name="group" type="text" required="required" />
          <label for="update-gpa">GPA</label>
          <input id="update-gpa" name="gpa" type="number" step="0.01" min="0" max="5" required="required" />
          <button type="submit">Обновить</button>
        </fieldset>
      </form>

      <form id="delete-form">
        <fieldset>
          <legend><strong>Удалить студента</strong></legend>
          <label for="delete-id">ID</label>
          <input id="delete-id" name="id" type="number" min="1" required="required" />
          <button type="submit">Удалить</button>
        </fieldset>
      </form>
    </div>

    <div id="status" class="status" aria-live="polite"></div>

    <script type="text/javascript">
      //<![CDATA[
      (function () {
        var apiUrl = '/api/students';
        var statusElement = document.getElementById('status');
        var studentsBody = document.getElementById('students-body');

        function setStatus(message, isError) {
          statusElement.textContent = message;
          statusElement.style.color = isError ? '#b91c1c' : '#0b3d91';
        }

        function renderStudents(students) {
          studentsBody.innerHTML = '';
          students.forEach(function (student) {
            var row = document.createElement('tr');
            row.innerHTML = '<td>' + student.id + '</td>' +
              '<td>' + student.firstName + '</td>' +
              '<td>' + student.lastName + '</td>' +
              '<td>' + student.group + '</td>' +
              '<td>' + student.gpa.toFixed(2) + '</td>';
            studentsBody.appendChild(row);
          });
        }

        function toJsonResponse(response) {
          if (!response.ok) {
            return response.json().then(function (body) {
              throw body;
            }).catch(function (err) {
              throw err || { title: 'Неизвестная ошибка' };
            });
          }

          if (response.status === 204) {
            return null;
          }

          return response.json();
        }

        document.getElementById('filter-form').addEventListener('submit', function (event) {
          event.preventDefault();
          var params = [];
          var groupValue = document.getElementById('filter-group').value;
          var gpaValue = document.getElementById('filter-gpa').value;

          if (groupValue) {
            params.push('group=' + encodeURIComponent(groupValue));
          }
          if (gpaValue) {
            params.push('minGpa=' + encodeURIComponent(gpaValue));
          }

          var url = apiUrl + (params.length > 0 ? '?' + params.join('&') : '');

          fetch(url)
            .then(toJsonResponse)
            .then(function (data) {
              renderStudents(data);
              setStatus('Список студентов обновлён.', false);
            })
            .catch(function (error) {
              setStatus('Ошибка загрузки: ' + (error.title || JSON.stringify(error)), true);
            });
        });

        document.getElementById('create-form').addEventListener('submit', function (event) {
          event.preventDefault();
          var payload = {
            firstName: document.getElementById('create-first-name').value,
            lastName: document.getElementById('create-last-name').value,
            group: document.getElementById('create-group').value,
            gpa: parseFloat(document.getElementById('create-gpa').value)
          };

          fetch(apiUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          })
            .then(toJsonResponse)
            .then(function (created) {
              setStatus('Студент #' + created.id + ' создан.', false);
              document.getElementById('filter-form').dispatchEvent(new Event('submit'));
            })
            .catch(function (error) {
              setStatus('Ошибка создания: ' + formatValidationError(error), true);
            });
        });

        document.getElementById('update-form').addEventListener('submit', function (event) {
          event.preventDefault();
          var id = parseInt(document.getElementById('update-id').value, 10);
          var payload = {
            firstName: document.getElementById('update-first-name').value,
            lastName: document.getElementById('update-last-name').value,
            group: document.getElementById('update-group').value,
            gpa: parseFloat(document.getElementById('update-gpa').value)
          };

          fetch(apiUrl + '/' + id, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          })
            .then(function (response) {
              if (response.status === 204) {
                return null;
              }
              return toJsonResponse(response);
            })
            .then(function () {
              setStatus('Студент #' + id + ' обновлён.', false);
              document.getElementById('filter-form').dispatchEvent(new Event('submit'));
            })
            .catch(function (error) {
              setStatus('Ошибка обновления: ' + formatValidationError(error), true);
            });
        });

        document.getElementById('delete-form').addEventListener('submit', function (event) {
          event.preventDefault();
          var id = parseInt(document.getElementById('delete-id').value, 10);

          fetch(apiUrl + '/' + id, { method: 'DELETE' })
            .then(function (response) {
              if (response.status === 204) {
                return null;
              }
              return toJsonResponse(response);
            })
            .then(function () {
              setStatus('Студент #' + id + ' удалён.', false);
              document.getElementById('filter-form').dispatchEvent(new Event('submit'));
            })
            .catch(function (error) {
              setStatus('Ошибка удаления: ' + (error.title || JSON.stringify(error)), true);
            });
        });

        function formatValidationError(error) {
          if (error && error.errors) {
            var parts = [];
            for (var key in error.errors) {
              if (Object.prototype.hasOwnProperty.call(error.errors, key)) {
                parts.push(key + ': ' + error.errors[key].join(', '));
              }
            }
            return parts.join('; ');
          }
          return error.title || JSON.stringify(error);
        }

        // Загрузим список студентов при открытии страницы.
        document.getElementById('filter-form').dispatchEvent(new Event('submit'));
      })();
      //]]>
    </script>
  </body>
</html>
